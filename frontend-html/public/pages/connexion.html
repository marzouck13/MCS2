<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Mon Carnet Sante</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/composants.css">
    <link rel="stylesheet" href="/css/pages/connexion.css">
</head>
<body>
    <main class="page-connexion">
        <div class="page-connexion__voile" aria-hidden="true"></div>

        <section class="page-connexion__carte">
            <h1 class="page-connexion__titre">Connexion</h1>
            <p class="page-connexion__sous-titre">
                Entrez votre NPI et votre mot de passe pour acceder a votre espace professionnel.
            </p>

            <div id="zone-erreur" hidden class="message message--erreur" role="alert">
                <span class="message__icone" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </span>
                <p id="texte-erreur" class="message__texte"></p>
            </div>

            <form id="formulaire-connexion" novalidate>
                <div class="champ">
                    <label for="champ-npi" class="champ__label">
                        Numero d'Identification Professionnelle NPI <span class="champ__obligatoire">*</span>
                    </label>
                    <input
                        id="champ-npi"
                        name="npiProfessionnel"
                        type="text"
                        class="champ__input"
                        placeholder="Ex : 9876543210"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="username"
                        required
                    >
                    <p class="champ__aide">10 chiffres, figure sur votre carte CIP.</p>
                    <p class="champ__erreur" id="erreur-npi" hidden></p>
                </div>

                <div class="champ">
                    <label for="champ-mdp" class="champ__label">
                        Mot de passe <span class="champ__obligatoire">*</span>
                    </label>
                    <div class="champ__conteneur-icone">
                        <input
                            id="champ-mdp"
                            name="motDePasse"
                            type="password"
                            class="champ__input champ__input--avec-icone-droite"
                            placeholder="Votre mot de passe"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" id="bouton-afficher-mdp" class="champ__icone-droite" aria-label="Afficher le mot de passe">
                            <svg id="icone-oeil-ouvert" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="icone-oeil-ferme" hidden width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <p class="champ__erreur" id="erreur-mdp" hidden></p>
                </div>

                <button type="submit" id="bouton-connexion" class="bouton bouton--primaire bouton--grand bouton--pleine-largeur">
                    Se connecter
                </button>
            </form>

            <p class="page-connexion__lien">
                Pas encore inscrit ? <br><br>
                <a href="/inscription"><strong>Creer mon compte</strong></a>
            </p>
        </section>
    </main>

    <script src="/js/api-client.js"></script>
    <script src="/js/pages/connexion.js"></script>
</body>
</html>
