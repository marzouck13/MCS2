<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche patient - Mon Carnet Sante</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/composants.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages/recherche-patient.css">
</head>
<body>
    <div class="layout-pro">
        <div id="conteneur-sidebar"></div>

        <div class="layout-pro__contenu">
            <header class="layout-pro__entete-mobile">
                <button type="button" id="bouton-menu-mobile" class="layout-pro__bouton-menu" aria-label="Ouvrir le menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <span class="layout-pro__titre-mobile">Recherche patient</span>
            </header>

            <main class="layout-pro__principal">
                <div class="recherche__conteneur">
                    <div class="recherche__formulaire">
                        <div id="zone-erreur" hidden class="message message--erreur" role="alert">
                            <span class="message__icone" aria-hidden="true">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="8" x2="12" y2="12"></line>
                                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                </svg>
                            </span>
                            <p id="texte-erreur" class="message__texte"></p>
                        </div>

                        <form id="formulaire-recherche" novalidate>
                            <div class="champ">
                                <label for="champ-npi" class="champ__label">
                                    Numero Personnel d'Identification (NPI) <span class="champ__obligatoire">*</span>
                                </label>
                                <input
                                    id="champ-npi"
                                    name="npi"
                                    type="text"
                                    class="champ__input"
                                    placeholder="Ex : 2222222222"
                                    maxlength="10"
                                    inputmode="numeric"
                                    required
                                >
                                <p class="champ__aide">Le NPI figure sur la carte d'identite du patient.</p>
                                <p class="champ__erreur" id="erreur-npi" hidden></p>
                            </div>

                            <button type="submit" id="bouton-rechercher" class="bouton bouton--primaire bouton--grand bouton--pleine-largeur">
                                Rechercher le patient
                            </button>
                        </form>

                        <div class="recherche__separateur">
                            <div class="recherche__separateur-ligne"></div>
                            <span class="recherche__separateur-texte">ou</span>
                            <div class="recherche__separateur-ligne"></div>
                        </div>

                        <a href="/scanner-qr" class="bouton bouton--secondaire bouton--grand bouton--pleine-largeur" style="text-decoration: none;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="3" width="7" height="7"></rect>
                                <rect x="14" y="3" width="7" height="7"></rect>
                                <rect x="3" y="14" width="7" height="7"></rect>
                                <line x1="14" y1="14" x2="14" y2="14.01"></line>
                                <line x1="21" y1="14" x2="21" y2="21"></line>
                                <line x1="14" y1="21" x2="14" y2="21.01"></line>
                                <line x1="18" y1="21" x2="18" y2="21.01"></line>
                                <line x1="21" y1="18" x2="21" y2="18.01"></line>
                            </svg>
                            Scanner un QR code patient
                        </a>
                    </div>

                    <div id="zone-resultat" hidden>
                        <div class="recherche__resultat-titre">
                            <span class="recherche__resultat-point"></span>
                            <span class="recherche__resultat-label">Patient trouve</span>
                        </div>
                        <article class="carte-patient">
                            <div class="carte-patient__bandeau" id="resultat-bandeau"></div>
                            <div class="carte-patient__corps">
                                <div class="carte-patient__identite">
                                    <div class="carte-patient__avatar" id="resultat-initiale">?</div>
                                    <div class="carte-patient__infos">
                                        <p class="carte-patient__nom" id="resultat-nom">-</p>
                                        <p class="carte-patient__detail" id="resultat-npi">-</p>
                                        <p class="carte-patient__detail" id="resultat-age">-</p>
                                        <p class="carte-patient__detail" id="resultat-ville"></p>
                                    </div>
                                </div>

                                <div class="carte-patient__badges" id="resultat-badges"></div>

                                <div class="carte-patient__consentement" id="resultat-consentement">
                                    <span class="carte-patient__consentement-icone" aria-hidden="true">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                                            <polyline points="9 12 11 14 15 10"></polyline>
                                        </svg>
                                    </span>
                                    <div class="carte-patient__consentement-texte">
                                        <p class="carte-patient__consentement-titre" id="resultat-consentement-titre"></p>
                                        <p id="resultat-consentement-desc"></p>
                                    </div>
                                </div>

                                <div class="carte-patient__actions" id="resultat-actions"></div>
                            </div>
                        </article>
                    </div>

                    <div id="zone-vide" class="recherche__etat-vide">
                        <div class="recherche__etat-vide-icone" aria-hidden="true">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <p class="recherche__etat-vide-texte">
                            Saisissez le NPI du patient ou scannez son QR code pour acceder a son dossier.
                        </p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/js/api-client.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/pages/recherche-patient.js"></script>
</body>
</html>
