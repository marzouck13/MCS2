<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable - Mon Carnet Santé</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/composants.css">
    <link rel="stylesheet" href="/css/pages/404.css">
</head>
<body>
    <main class="page-erreur">
        <div class="page-erreur__bloc">
            <p class="page-erreur__code">404</p>
            <h1 class="page-erreur__titre">Page introuvable</h1>
            <p class="page-erreur__description">
                La page que vous recherchez n'existe pas ou a été déplacée.<br>
                Vérifiez l'URL ou retournez à l'accueil.
            </p>
            <div class="page-erreur__actions">
                <a href="/connexion" class="bouton bouton--primaire">Retour à la connexion</a>
                <a href="javascript:history.back()" class="bouton bouton--neutre">Page précédente</a>
            </div>
        </div>
    </main>
</body>
</html>
