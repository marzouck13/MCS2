<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle ordonnance - Mon Carnet Sante</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/composants.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages/ordonnance.css">
</head>
<body>
    <div class="layout-pro">
        <div id="conteneur-sidebar"></div>

        <div class="layout-pro__contenu">
            <header class="layout-pro__entete-mobile">
                <button type="button" id="bouton-menu-mobile" class="layout-pro__bouton-menu" aria-label="Ouvrir le menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <span class="layout-pro__titre-mobile">Nouvelle ordonnance</span>
            </header>

            <main class="layout-pro__principal">
                <div class="ordonnance__conteneur">
                    <div id="chargement" class="message message--avertissement" style="justify-content: center;">Chargement du dossier...</div>

                    <div id="zone-erreur" hidden class="message message--erreur" role="alert">
                        <span class="message__icone" aria-hidden="true">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        </span>
                        <p id="texte-erreur" class="message__texte"></p>
                    </div>

                    <form id="formulaire-ordonnance" novalidate hidden>
                        <div class="carte">
                            <div class="champ">
                                <label for="champ-consultation" class="champ__label">Consultation liee <span class="champ__obligatoire">*</span></label>
                                <select id="champ-consultation" class="champ__input champ__select" required>
                                    <option value="">Choisir une consultation</option>
                                </select>
                            </div>

                            <h2 class="ordonnance__section-titre">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                                Medicaments
                            </h2>

                            <div id="liste-medicaments"></div>

                            <button type="button" id="bouton-ajouter-medicament" class="bouton bouton--neutre" style="margin-bottom: 16px;">
                                Ajouter un medicament
                            </button>

                            <h2 class="ordonnance__section-titre">Instructions generales</h2>

                            <div class="champ">
                                <label for="champ-instructions" class="champ__label">Instructions</label>
                                <textarea id="champ-instructions" class="champ__input" rows="3" placeholder="Ex : Prendre pendant les repas, eviter l alcool..."></textarea>
                            </div>

                            <div class="champ">
                                <label for="champ-duree-traitement" class="champ__label">Duree du traitement</label>
                                <input type="text" id="champ-duree-traitement" class="champ__input" placeholder="Ex : 7 jours">
                            </div>

                            <div class="ordonnance__actions">
                                <button type="submit" id="bouton-generer" class="bouton bouton--primaire bouton--grand">
                                    Generer l'ordonnance
                                </button>
                                <a href="#" id="lien-annuler" class="bouton bouton--neutre bouton--grand" style="text-decoration: none; text-align: center;">
                                    Annuler
                                </a>
                            </div>
                        </div>
                    </form>

                    <div id="zone-succes" hidden>
                        <div class="carte">
                            <div class="ordonnance__succes">
                                <div class="ordonnance__succes-icone" aria-hidden="true">
                                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <h2 class="ordonnance__succes-titre">Ordonnance enregistree</h2>
                                <p class="ordonnance__succes-desc">Code de l'ordonnance :</p>
                                <div class="ordonnance__code">
                                    <span class="ordonnance__code-texte" id="texte-code-ordonnance">-</span>
                                </div>
                                <p class="ordonnance__succes-desc" style="margin-top: 12px;">Le patient peut se presenter en pharmacie avec ce code ou son NPI.</p>
                                <div class="ordonnance__succes-actions">
                                    <button type="button" id="bouton-imprimer" class="bouton bouton--primaire">Imprimer</button>
                                    <a href="#" id="lien-retour-dossier" class="bouton bouton--neutre" style="text-decoration: none; text-align: center;">Retour au dossier</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/js/api-client.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/pages/ordonnance.js"></script>
</body>
</html>
