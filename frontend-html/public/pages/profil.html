<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - Mon Carnet Sante</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/composants.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/alertes.css">
    <link rel="stylesheet" href="/css/pages/profil.css">
</head>
<body>
    <div class="layout-pro">
        <div id="conteneur-sidebar"></div>

        <div class="layout-pro__contenu">
            <header class="layout-pro__entete-mobile">
                <button type="button" id="bouton-menu-mobile" class="layout-pro__bouton-menu" aria-label="Ouvrir le menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <span class="layout-pro__titre-mobile">Mon Profil</span>
            </header>

            <main class="layout-pro__principal">
                <div class="profil__conteneur">
                    <div id="chargement" class="message message--avertissement" style="justify-content: center;">Chargement du profil...</div>

                    <div id="contenu-profil" hidden>
                        <div class="profil__entete">
                            <div class="profil__entete-deco"></div>
                            <div class="profil__avatar">
                                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            </div>
                            <h1 class="profil__nom" id="profil-nom">-</h1>
                            <p class="profil__role" id="profil-role">-</p>
                            <span class="badge badge--succes"><span class="badge__point"></span>Compte actif</span>
                        </div>

                        <div class="profil__detail">
                            <div style="margin-bottom: 20px;">
                                <p class="profil__label">Identifiant National</p>
                                <p class="profil__valeur" id="profil-npi" style="font-family: monospace;">-</p>
                            </div>

                            <div class="profil__grille">
                                <div>
                                    <p class="profil__label">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                                        Telephone
                                    </p>
                                    <p class="profil__valeur" id="profil-telephone">-</p>
                                </div>
                                <div>
                                    <p class="profil__label">Email</p>
                                    <p class="profil__valeur" id="profil-email">-</p>
                                </div>
                            </div>

                            <div style="margin-top: 20px;">
                                <p class="profil__label">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"></path><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"></path><circle cx="20" cy="10" r="2"></circle></svg>
                                    Etablissement d'exercice
                                </p>
                                <p class="profil__valeur" id="profil-etablissement">-</p>
                            </div>
                        </div>

                        <div style="text-align: center;">
                            <button type="button" id="bouton-deconnexion" class="bouton bouton--danger">Se deconnecter</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/js/api-client.js"></script>
    <script src="/js/alertes.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/pages/profil.js"></script>
</body>
</html>
